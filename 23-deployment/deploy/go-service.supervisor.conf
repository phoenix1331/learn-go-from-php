; Supervisor config, the same tool Laravel's docs use for queue:work.
; On Laravel Forge, create a Daemon with the same command instead.
;
;   sudo cp go-service.supervisor.conf /etc/supervisor/conf.d/go-service.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status

[program:go-service]
command=/usr/local/bin/go-service -serve -addr=127.0.0.1:8080
user=forge
autostart=true
autorestart=true
stopsignal=TERM
; Same idea as for queue:work: longer than the grace period in service.go.
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/go-service.log
